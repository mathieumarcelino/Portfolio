# Nom de projet figé : le service portfolio-webhook pilote ce même projet
# depuis son conteneur.
name: portfolio

networks:
  proxy:
    external: true

services:
  portfolio-app:
    container_name: portfolio-app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      # Variables de build (accès à Strapi), lues dans le .env à côté de ce fichier
      args:
        STRAPI_URL: ${STRAPI_URL}
        STRAPI_MEDIA_URL: ${STRAPI_MEDIA_URL:-}
        # Valeur changeante pour forcer la régénération du contenu
        # (voir Dockerfile) : fournie par le rebuild automatique, ou à la main
        # avec CACHE_BUST=$(date +%s) docker compose up -d --build
        CACHE_BUST: ${CACHE_BUST:-}
      secrets:
        - strapi_token
    networks:
      - proxy

  # Reçoit le webhook « Publier » de Strapi et reconstruit portfolio-app.
  # Joignable uniquement sur le réseau Docker interne « proxy » (aucun port
  # publié) : http://portfolio-webhook:9000/hooks/rebuild
  portfolio-webhook:
    container_name: portfolio-webhook
    restart: unless-stopped
    build: ./deploy/webhook
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?définir WEBHOOK_SECRET dans .env (openssl rand -hex 32)}
      DEBOUNCE_SECONDS: ${REBUILD_DEBOUNCE_SECONDS:-30}
    volumes:
      # Accès au démon Docker pour lancer le build (équivalent root sur l'hôte)
      - /var/run/docker.sock:/var/run/docker.sock
      # Le projet, en lecture seule : contexte de build et .env
      - ./:/srv/portfolio:ro
    networks:
      - proxy

secrets:
  # Token Strapi transmis au build comme secret BuildKit (variable STRAPI_TOKEN du .env)
  strapi_token:
    environment: STRAPI_TOKEN
