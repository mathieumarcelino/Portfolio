version: '3.8'

networks:
  proxy:
    external: true

services:
  portfolio-app:
    container_name: portfolio-app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      # Variables de build de l'app, lues dans le .env à côté de ce fichier
      args:
        REACT_APP_STRAPI_URL: ${REACT_APP_STRAPI_URL}
        REACT_APP_STRAPI_TOKEN: ${REACT_APP_STRAPI_TOKEN:-}
    networks:
      - proxy
    volumes:
      - ./public:/var/www/public:ro
