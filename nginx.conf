server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : divise par ~3 le poids du JS, du CSS et du HTML.
    # gzip_proxied any : les requêtes arrivent via Nginx Proxy Manager.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        image/x-icon;

    # Redirections relatives (/en -> /en/) : le conteneur est derrière un proxy.
    absolute_redirect off;

    # Pages HTML générées (/, /en/, /pt/…) : toujours revalidées, pour que
    # chaque publication soit visible immédiatement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Fichiers générés par Astro dont le nom contient un hash :
    # ils ne changent jamais à URL égale, cache d'un an.
    location ^~ /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autres assets (favicon, manifest, images de public/) : noms fixes,
    # cache court pour que leurs mises à jour soient prises en compte.
    location ~* \.(ico|json|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|webmanifest|pdf|txt|xml)$ {
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Page 404 générée par Astro (le statut 404 est conservé).
    error_page 404 /404.html;
}
